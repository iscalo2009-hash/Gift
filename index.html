<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffd6e4">
<title>Teto Gift</title>
<style>
:root{
  --pink:#ffd6e4; --pink2:#ff9ec4; --rose:#f0788f; --red:#d6244a; --white:#fff9fb; --ink:#4a1428;
  --font:"Trebuchet MS","Segoe UI",system-ui,sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:var(--pink);font-family:var(--font);color:var(--ink);user-select:none}
#app{position:fixed;inset:0;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom);
  background:
   radial-gradient(circle at 20% 15%,#fff 0,transparent 35%),
   radial-gradient(circle at 85% 80%,var(--pink2) 0,transparent 45%),
   linear-gradient(160deg,#ffe4ee,#ffb6d0 70%,#ff97b8);
  overflow:hidden}
#app::before{content:"";position:absolute;inset:0;opacity:.18;pointer-events:none;
  background:repeating-linear-gradient(0deg,#d6244a 0 1px,transparent 1px 4px);animation:scan 8s linear infinite}
@keyframes scan{to{background-position:0 80px}}
#fx{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.fl{position:absolute;bottom:-40px;animation:rise linear forwards;color:var(--red);text-shadow:0 0 8px #fff}
@keyframes rise{to{transform:translateY(-115vh) rotate(40deg);opacity:0}}
.scene{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;
  opacity:0;pointer-events:none;transition:opacity .7s,transform .7s;transform:scale(1.04)}
.scene.on{opacity:1;pointer-events:auto;transform:none}

/* Teto (ilustraciones PNG) */
.teto-wrap{position:relative;flex:1;width:100%;display:flex;align-items:flex-end;justify-content:center;min-height:0;padding-top:8px}
.tetoslot{width:100%;justify-content:center}
.teto{height:100%;max-width:100%;width:auto;aspect-ratio:300/452;display:block;pointer-events:none;-webkit-user-drag:none;
  filter:drop-shadow(0 8px 14px #d6244a55);animation:bob 3.2s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-7px) rotate(-.8deg)}}
:root{--sh:drop-shadow(0 8px 14px #d6244a55);--gl:hue-rotate(40deg) drop-shadow(4px 0 #0ff8)}
.teto.glitch{animation:gl .28s steps(2) 1,bob 3.2s ease-in-out .28s infinite}
@keyframes gl{0%{transform:translateX(-6px);filter:var(--gl)}50%{transform:translateX(6px) skewX(3deg);filter:hue-rotate(-40deg) drop-shadow(-4px 0 #f0f8)}100%{transform:none;filter:var(--sh)}}
.teto.r-soft{animation:soft .7s ease-out 1,bob 3.2s ease-in-out .7s infinite}
.teto.r-hop{animation:hop 1s ease-out 1,bob 3.2s ease-in-out 1s infinite}
.teto.r-tilt{animation:tilt 1s ease-out 1,bob 3.2s ease-in-out 1s infinite}
.teto.r-shy{animation:shy 1.1s ease-out 1,bob 3.2s ease-in-out 1.1s infinite}
.teto.r-pop{animation:popx .8s ease-out 1,bob 3.2s ease-in-out .8s infinite}
@keyframes soft{0%{transform:scale(.97);filter:var(--gl)}100%{transform:none;filter:var(--sh)}}
@keyframes hop{0%{transform:translateX(-5px);filter:var(--gl)}15%{transform:none;filter:var(--sh)}35%{transform:translateY(-22px)}55%{transform:none}70%{transform:translateY(-10px)}85%,100%{transform:none}}
@keyframes tilt{0%{transform:translateX(5px);filter:var(--gl)}15%{filter:var(--sh)}40%,70%{transform:rotate(-3.5deg) scale(1.03)}100%{transform:none}}
@keyframes shy{0%{transform:translateX(-4px);filter:var(--gl)}15%{filter:var(--sh)}45%,75%{transform:scale(.96) rotate(2deg) translateY(4px)}100%{transform:none}}
@keyframes popx{0%{transform:translateX(5px);filter:var(--gl)}15%{filter:var(--sh)}30%{transform:scale(1.07) translateY(-14px)}60%{transform:scale(.99)}100%{transform:none}}
.teto .drl,.teto .drr{transform-box:fill-box;transform-origin:50% 0;animation:sway 2.8s ease-in-out infinite}
.teto .drr{animation-direction:reverse}
@keyframes sway{50%{transform:rotate(3deg)}}
.teto .blink{transform-box:fill-box;transform-origin:center;animation:blink 4.5s infinite}
@keyframes blink{0%,94%,100%{transform:scaleY(1)}97%{transform:scaleY(.1)}}
#halo{position:absolute;left:50%;top:42%;width:150vmax;height:150vmax;margin:-75vmax 0 0 -75vmax;pointer-events:none;
  background:repeating-conic-gradient(#ffffff66 0 7deg,transparent 7deg 22deg);
  -webkit-mask:radial-gradient(circle,#000 0,transparent 32%);mask:radial-gradient(circle,#000 0,transparent 32%);animation:spin 50s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.st,.bst{background:#fff;clip-path:polygon(50% 0,62% 38%,100% 50%,62% 62%,50% 100%,38% 62%,0 50%,38% 38%);filter:drop-shadow(0 0 4px #ff5f8f)}
.fl.st{width:var(--s);height:var(--s);font-size:0}
.bst{position:absolute;width:var(--s,14px);height:var(--s,14px);z-index:15;pointer-events:none;animation:fly .9s ease-out forwards}
.bst.h{background:var(--red);clip-path:none;font-size:18px;line-height:1;width:auto;height:auto;filter:drop-shadow(0 0 4px #fff)}
@keyframes fly{from{transform:translate(0,0) scale(.3)}to{transform:translate(var(--dx),var(--dy)) scale(1.2) rotate(120deg);opacity:0}}
#gl{position:absolute;inset:0;z-index:18;pointer-events:none;opacity:0;mix-blend-mode:screen;
  background:repeating-linear-gradient(0deg,#ff3d7f66 0 5px,#3dd8ff55 5px 9px,transparent 9px 22px)}
#gl.go{animation:glf .38s steps(3) 1}
@keyframes glf{0%{opacity:.9;transform:translateX(-10px)}33%{opacity:.5;transform:translateX(9px)}66%{opacity:.7;transform:translateX(-5px)}100%{opacity:0}}
.btn{position:relative;overflow:hidden}
.btn::after{content:"";position:absolute;top:0;left:-70%;width:40%;height:100%;background:linear-gradient(100deg,transparent,#fffa,transparent);transform:skewX(-20deg);animation:shine 3.2s infinite}
@keyframes shine{60%,100%{left:140%}}
#load{position:absolute;inset:0;z-index:50;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:30px;
  background:radial-gradient(circle at 50% 40%,#fff 0,#ffd0e1 45%,#ff8fb5);transition:opacity .6s}
#load.hide{opacity:0;pointer-events:none}
.tap{position:absolute;bottom:14%;left:0;right:0;text-align:center;font-weight:900;font-size:22px;letter-spacing:.06em;color:var(--red);
  text-shadow:0 0 8px #fff;opacity:0;pointer-events:none;transition:opacity .4s}
#load.wait .tap{opacity:1;animation:pulse 1.4s ease-in-out infinite}
#load.wait .bar{opacity:.5}
.bar{width:56%;max-width:300px;height:14px;border-radius:99px;background:#fff9;border:2px solid var(--red);overflow:hidden}
.bar i{display:block;height:100%;width:0;background:repeating-linear-gradient(45deg,#ff6b8f 0 10px,#d6244a 10px 20px);animation:fillbar 1.8s ease-in-out forwards,stripes .6s linear infinite}
@keyframes fillbar{to{width:100%}}
@keyframes stripes{to{background-position:28px 0}}
#ldsvg{width:130px;height:117px;filter:drop-shadow(0 8px 14px #d6244a88);animation:beat 1s ease-in-out infinite}
@keyframes beat{0%,100%{transform:scale(1)}15%{transform:scale(1.18)}30%{transform:scale(1.02)}45%{transform:scale(1.14)}70%{transform:scale(1)}}
.pop{animation:pop .5s cubic-bezier(.2,1.6,.4,1) both}
@keyframes pop{from{transform:scale(.3) translateY(60px);opacity:0}}

/* Scene 1 */
#s1{justify-content:flex-end}
.btn{border:0;cursor:pointer;font-family:var(--font);color:#fff;background:linear-gradient(180deg,#ff6b8f,var(--red));
  border-radius:999px;box-shadow:0 6px 0 #99183a,0 12px 20px #d6244a66;transition:transform .15s,box-shadow .15s}
.btn:active{transform:translateY(5px);box-shadow:0 1px 0 #99183a}
#gift{width:92px;height:92px;font-size:44px;margin:10px 0 36px;animation:pulse 1.6s ease-in-out infinite;display:grid;place-items:center}
@keyframes pulse{50%{transform:scale(1.1)}}

/* Scene 2 */
#box{position:relative;width:min(92%,560px);min-height:150px;margin:0 0 14px;padding:22px 20px 20px;border-radius:22px;
  background:var(--white);border:3px solid var(--red);box-shadow:0 8px 0 #f0788f88,0 14px 28px #d6244a40;
  font-size:clamp(18px,5vw,24px);line-height:1.4;font-weight:700;display:flex;align-items:center}
#box::before{content:"";position:absolute;inset:6px;border:2px dashed var(--pink2);border-radius:16px;pointer-events:none}
#box.in{animation:boxin .45s cubic-bezier(.2,1.4,.4,1)}
@keyframes boxin{from{transform:translateY(30px) scale(.94);opacity:0}}
#txt::after{content:"";display:inline-block;width:3px;height:1em;background:var(--red);margin-left:3px;vertical-align:-2px;animation:cur .7s steps(2) infinite}
#txt.done::after{display:none}
@keyframes cur{50%{opacity:0}}
.nav{display:flex;gap:22px;margin:0 0 28px}
.nb{width:64px;height:64px;font-size:28px;display:grid;place-items:center}
.nb[disabled]{opacity:.35;pointer-events:none}
.dots{display:flex;gap:8px;margin:0 0 14px}
.dots i{width:10px;height:10px;border-radius:50%;background:var(--pink2);transition:.3s}
.dots i.on{background:var(--red);transform:scale(1.4)}

/* Scene 3 */
#wipe{position:absolute;inset:0;z-index:20;pointer-events:none;background:radial-gradient(circle,#fff 0,var(--pink2) 40%,var(--red));
  clip-path:circle(0% at 50% 60%)}
#wipe.go{animation:wipe 1.3s ease-in-out forwards}
@keyframes wipe{0%{clip-path:circle(0% at 50% 60%)}45%{clip-path:circle(150% at 50% 60%)}60%{clip-path:circle(150% at 50% 60%)}100%{clip-path:circle(0% at 50% 60%);opacity:0}}
#s3{justify-content:flex-end}
#dedic{width:min(92%,560px);padding:24px 20px;margin:0 0 18px;border-radius:22px;background:var(--white);border:3px solid var(--red);
  box-shadow:0 8px 0 #f0788f88,0 14px 28px #d6244a40;text-align:center;font-size:clamp(22px,7vw,34px);font-weight:900;letter-spacing:.04em;line-height:1.25;color:var(--red);animation:boxin .6s .5s cubic-bezier(.2,1.4,.4,1) both}
#play{padding:16px 54px;font-size:26px;font-weight:900;margin:0 0 36px;animation:pulse 1.6s ease-in-out infinite}
.spk{position:absolute;color:#fff;text-shadow:0 0 8px var(--red),0 0 16px var(--pink2);animation:tw 2s ease-in-out infinite}
@keyframes tw{50%{transform:scale(.3);opacity:.3}}
.btn:hover{filter:brightness(1.08)}
.btn{cursor:pointer}
@media (min-aspect-ratio:11/10) and (min-width:720px){
  #s2,#s3{display:grid;grid-template-columns:minmax(0,1fr) minmax(340px,520px);grid-template-rows:1fr auto auto auto 1fr;column-gap:5vw;padding:4vh 5vw;align-items:center;justify-content:center}
  #s2 .teto-wrap,#s3 .teto-wrap{grid-column:1;grid-row:1/-1;height:100%;align-self:stretch}
  #s2 .dots{grid-column:2;grid-row:2;justify-self:center;margin:0 0 14px}
  #s2 #box{grid-column:2;grid-row:3;width:100%;margin:0;font-size:clamp(20px,2.1vw,28px);min-height:170px}
  #s2 .nav{grid-column:2;grid-row:4;justify-self:center;margin:24px 0 0}
  #s3 #dedic{grid-column:2;grid-row:2;width:100%;margin:0 0 24px;font-size:clamp(26px,3vw,40px)}
  #s3 #play{grid-column:2;grid-row:3;justify-self:center;margin:0}
  #s1 #gift{margin-bottom:5vh}
}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01s!important;animation-iteration-count:1!important}}
</style>
</head>
<body>
<div id="app">
  <div id="halo"></div>
  <div id="fx"></div>

  <!-- ESCENA 1 -->
  <section class="scene on" id="s1">
    <div class="teto-wrap"><div class="tetoslot" style="height:100%;display:flex;align-items:flex-end"></div></div>
    <button class="btn" id="gift" aria-label="regalo">🎁</button>
  </section>

  <!-- ESCENA 2 -->
  <section class="scene" id="s2">
    <div class="teto-wrap"><div class="tetoslot" style="height:100%;display:flex;align-items:flex-end"></div></div>
    <div class="dots" id="dots"></div>
    <div id="box"><span id="txt"></span></div>
    <div class="nav">
      <button class="btn nb" id="prev" aria-label="anterior">◀</button>
      <button class="btn nb" id="next" aria-label="siguiente">▶</button>
    </div>
  </section>

  <!-- ESCENA 3 -->
  <section class="scene" id="s3">
    <div class="teto-wrap"><div class="tetoslot" style="height:100%;display:flex;align-items:flex-end"></div></div>
    <div id="dedic">TE DEDICO ESTA CANCION</div>
    <button class="btn" id="play">play</button>
  </section>

  <div id="wipe"></div>
  <div id="gl"></div>
  <div id="load"><svg id="ldsvg" viewBox="0 0 100 90"></svg><div class="bar"><i></i></div><div class="tap">toca para empezar ♥</div></div>
</div>

<script>
/* ============ CONFIGURACIÓN EDITABLE ============ */
const SPOTIFY_URL = "https://open.spotify.com/track/1H2pPtoPS8kNlqCN7HfT6g?si=gaqzjLDsTqqmG4KuOMYS5g&utm_source=copy-link";   // ← Pega aquí tu enlace de Spotify (https://open.spotify.com/track/...)

const DIALOGS = [         // Textos de Ismael. expr = expresión de Teto
  { text: "¡Holaaa, Aurora!", expr: "happy" },
  { text: "Sé que te disfrazaste de mí en Halloween...", expr: "wink" },
  { text: "Me contaron que te quedó muy bien el cosplay y te veías muy bonita.", expr: "smile" },
  { text: "Ya entiendo por qué Ismael está tan enamorado.", expr: "shy" },
  { text: "Además debes ser una gran persona.", expr: "smile" },
  { text: "Isma te quería dar un detalle, deja te muestro...", expr: "happy" }
];

const CONFIG = {
  typeSpeedMs: 38,        // velocidad de escritura
  particleEveryMs: 700,   // frecuencia de corazones/estrellas
  particles: ["♥","✦","♡","★","✧"],
  musicBpm: 175,          // tempo de la partitura (negra = 175)
  musicVolume: 0.5
};

/* ============ SONIDOS (sintetizados, sin archivos) ============ */
const AC = window.AudioContext || window.webkitAudioContext; let ac = null;
function tone(f, d=.07, type='triangle', v=.07, when=0){
  try{
    if(!ac) ac = new AC(); if(ac.state==='suspended') ac.resume();
    const t = ac.currentTime+when, o = ac.createOscillator(), g = ac.createGain();
    o.type = type; o.frequency.setValueAtTime(f, t);
    g.gain.setValueAtTime(v, t); g.gain.exponentialRampToValueAtTime(.0001, t+d);
    o.connect(g); g.connect(ac.destination); o.start(t); o.stop(t+d+.02);
  }catch(e){}
}
const SND = {
  tap:  ()=>tone(740,.05,'triangle',.06),
  next: ()=>{ tone(660,.08,'triangle',.09); tone(880,.11,'triangle',.08,.07); },
  prev: ()=>{ tone(660,.08,'triangle',.09); tone(494,.11,'triangle',.08,.07); },
  start:()=>[523,659,784,1047].forEach((f,i)=>tone(f,.16,'triangle',.08,i*.08)),
  whoosh:()=>[784,988,1175,1568,1976].forEach((f,i)=>tone(f,.18,'sine',.07,i*.07)),
  play: ()=>[659,784,988,1319].forEach((f,i)=>tone(f,.14,'triangle',.09,i*.06)),
  blip: ch=>{ const c=ch.toLowerCase(); if(!/[a-záéíóúñü0-9]/.test(c)) return;
    const base='aeiouáéíóú'.includes(c) ? 560 : 400;
    tone(base + (c.charCodeAt(0)%11)*32 + Math.random()*24, .05, 'triangle', .06); }
};

/* ============ MÚSICA (piano, transcrita de la partitura, en loop) ============ */
/* Cada compás = 4 tiempos. Formato: "nota+nota@duración" (duración en tiempos, r = silencio). */
const SCORE_RH = [
 "Bb4+Eb5+Bb5@1.5 C5+Bb5@1 Bb4+Bb5@.5 C5+C6@.5 Bb4+Bb5@.5",
 "Bb4+D5+G5+Eb6@2 G5@1 Ab5@1",
 "Bb4+Bb5@1 Bb4+Bb5@1 Bb4+Bb5@1 C5+C6@1",
 "Bb4+Bb5@2 Bb4+G5@1 Ab5@1",
 "Bb4+Bb5@1 Bb4+G5+Bb5@1 Bb4+Bb5@1 C5+C6@1",
 "Bb4+Eb5+Bb5@1.5 G5@.5 C5+F5@1 Bb4+Eb5@1",
 "Eb5+F5@1 F5@.5 Eb5@.5 Eb5+F5@.5 Eb5@.5 Eb5+F5@.5 Eb5+G5@.5",
 "Eb5+F5@.5 Bb4+Eb5@1 G5@.5 C5+F5@.5 C5+Eb5@.5 Ab4+C5@.5 C5+Eb5@.5",
 "C5+F5@1 C5+F5@1 F5@.5 Eb5+G5@.5 F5@.5 Eb5+G5@.5",
 "F5@.5 Bb4+Eb5@1 Eb5@.5 Eb5+G5@1 F5+Ab5@1",
 "Eb5+Bb5@1.5 Bb5@.5 G5+Bb5@.5 C6@.5 F5+Bb5@.5 C6@.5",
 "G5+Bb5@1.5 Eb5@.5 Eb5+G5@1 F5+Ab5@1",
 "Eb5+Bb5@1 G5+Bb5@1 F5+Bb5@.5 G5+C6@.5 F5+Bb5@.5 G5+C6@.5",
 "Eb5+Bb5@1.5 G5@.5 C5+F5@1 Bb4+Eb5@1",
 "F4+F5@1 Ab4+C5+F5@1 C5+F5@.5 Eb5@.5 C5+F5@.5 Eb5+G5@.5",
 "F5@.5 Eb5@1 Eb5@.5 F5@.5 Eb5@.5 C5@.5 Eb5@.5",
 "F5@1 F5@1 F5@.5 Eb5@.5 F5@.5 G5@.5",
 "F5@.5 Eb5@1 Eb5@.5 C5@1 Eb5@1",
 "Bb5@1.5 Bb5@1 Bb5@.5 C6@.5 Bb5@.5",
 "Eb5@2 G5@1 Ab5@1",
 "Bb4+Bb5@.5 C6@.5 Bb5@.5 C6@.5 Bb5@1.5 Eb5@.5",
 "Eb5+Bb5@.5 C6@.5 Bb5@.5 C6@.5 Bb5@1.5 Eb5@.5",
 "G5+Bb5@.5 C6@.5 Bb5@.5 C6@.5 Bb5@1 Ab5@1",
 "D5+G5@1 F5@1 Bb4+D5@1 Eb5@1",
 "Ab4+C5+Eb5@2 Ab4+C5+F5@1 G5@1"
];
const SCORE_LH = [
 "Bb2+Bb3@.5 C3@.5 D3@.5 F3+C4@1 Bb2+Bb3@.5 C3+C4@.5 Bb2+Bb3@.5",
 "Eb3@1.5 Eb3@.25 Bb2@.25 Eb2@1 r@1",
 "Eb2+Ab2+C3@3 Ab2+Bb2@1",
 "Eb2+Bb2+Eb3@2 Eb3+G3+Bb3@2",
 "F2+Ab2+C3@3 F2+Bb2@1",
 "Eb2+Bb2+Eb3@2 Eb2+Bn2@2",
 "F2+Ab2+C3@2 C3@1.5 Bb2@.5",
 "Eb2+G2+Bb2@2 Eb2+Eb3@1.5 Bb2@.5",
 "F2+Ab2+C3@2 Ab2+C3@1.5 Bb2@.5",
 "Eb2+G2+Bb2@2 C3+Bb3@2",
 "Ab2+C3@1.5 C4@.5 Bb3@1 Ab2+Bb2@1",
 "Eb2+G2+Bb2@2 Eb3+G3+Bb3@1.5 D3+F3@.5",
 "Ab2+C3@1.5 F3+Bb3@1.5 Bb2+C3@1",
 "Eb2+Bb2+Eb3@2 Eb2+Bn2@2",
 "F2+Ab2+C3@1 C4+Eb4+G4@1.5 C4+Eb4+G4@1.5",
 "Eb2+G2+Bb2@2 Ab2+Eb3@.5 Bb2@.5 C3+G3@.5 Eb3@.5",
 "F3+D4@1 F3+Ab3+C4@1.5 F3+Ab3+C4@1.5",
 "Eb3+G3+Eb4@1.5 C4@.5 Eb3+G3+C4@1 Eb3+G3+Bb3@1",
 "Bb2+D3+F3+Bb3@.5 Bb2+D3@.5 Bb2+D3@.5 Bb2+D3+F3+Bb3@.5 Bb2+D3@.5 Bb2+D3+F3+Bb3@.5 Bb2+D3+G3+C4@.5 Bb2+D3+F3+Bb3@.5",
 "Eb2+Bb2+Eb3@2 r@2",
 "Eb3+Ab3+C4@2 Eb3+Ab3+C4@.5 Eb3@.5 F3@.5 Ab3@.5",
 "Eb3+G3+Bb3@4",
 "Ab2+C3+Eb3@2 Ab2+C3+Eb3@.5 F2@.5 C3@.5 Bn2@.5",
 "Bb2+Bb3@2 Bn2+Bn3@2",
 "Ab2+Eb3+Ab3+C4@4"
];
const PC = {C:0,D:2,E:4,F:5,G:7,A:9,B:11};
const mf = n => 440*Math.pow(2,(n-69)/12);
function noteMidi(s){
  const m = /^([A-G])([b#n]?)(\d)$/.exec(s); if(!m) return null;
  return 12*(+m[3]+1) + PC[m[1]] + (m[2]==='b'?-1:m[2]==='#'?1:0);
}
function buildScore(){
  const ev = [];
  [[SCORE_RH,'rh'],[SCORE_LH,'lh']].forEach(([score,hand])=>{
    score.forEach((bar,i)=>{
      let t = i*4;
      bar.split(/\s+/).forEach(tok=>{
        const [ns,d] = tok.split('@'), dur = parseFloat(d);
        if(ns !== 'r'){
          const mids = ns.split('+').map(noteMidi).filter(x=>x!==null);
          mids.forEach(m=>ev.push({t, dur, f:mf(m), hand, n:mids.length}));
        }
        t += dur;
      });
    });
  });
  return ev.sort((a,b)=>a.t-b.t);
}
const EVENTS = buildScore(), LOOP_BEATS = SCORE_RH.length*4;
const MUSIC = { on:false, idx:0, base:0, timer:null, gain:null };
function pnote(f, t, dur, v){
  const d = Math.min(dur*60/CONFIG.musicBpm*1.15 + .25, 2.2);
  const o = ac.createOscillator(), o2 = ac.createOscillator(), g = ac.createGain(), g2 = ac.createGain();
  o.type = 'triangle'; o2.type = 'sine';
  o.frequency.setValueAtTime(f, t); o2.frequency.setValueAtTime(f*2, t);
  g.gain.setValueAtTime(.0001, t); g.gain.exponentialRampToValueAtTime(v, t+.008); g.gain.exponentialRampToValueAtTime(.0001, t+d);
  g2.gain.value = .3;
  o.connect(g); o2.connect(g2); g2.connect(g); g.connect(MUSIC.gain);
  o.start(t); o2.start(t); o.stop(t+d+.02); o2.stop(t+d+.02);
}
function musicTick(){
  const spb = 60/CONFIG.musicBpm;
  while (true){
    const e = EVENTS[MUSIC.idx], t = MUSIC.base + e.t*spb;
    if (t > ac.currentTime + .3) break;
    pnote(e.f, Math.max(t, ac.currentTime), e.dur, (e.hand==='lh' ? .16 : .2) / Math.sqrt(e.n));
    if (++MUSIC.idx >= EVENTS.length){ MUSIC.idx = 0; MUSIC.base += LOOP_BEATS*spb; }
  }
}
function startMusic(){
  try{
    if (MUSIC.on) return;
    if(!ac) ac = new AC(); if(ac.state==='suspended') ac.resume();
    MUSIC.gain = ac.createGain(); MUSIC.gain.gain.value = CONFIG.musicVolume * .6; MUSIC.gain.connect(ac.destination);
    MUSIC.base = ac.currentTime + .15; MUSIC.idx = 0; MUSIC.on = true;
    MUSIC.timer = setInterval(musicTick, 80);
  }catch(e){}
}
/* Si el navegador bloquea el audio automático, arranca con el primer toque/tecla */
function unlockAudio(){
  try{
    if(!ac) ac = new AC();
    if(ac.state==='suspended') ac.resume();
    startMusic();
    if(ac.state==='running') UNLOCK_EV.forEach(e=>removeEventListener(e, unlockAudio, true));
  }catch(e){}
}
const UNLOCK_EV = ['pointerdown','touchend','keydown','click'];
UNLOCK_EV.forEach(e=>addEventListener(e, unlockAudio, true));

  <path d="M${cx-rx-2} ${y-2}Q${cx} ${y-ry-8} ${cx+rx+3} ${y-6}" fill="none" stroke="#4a0a1a" stroke-width="4" stroke-linecap="round"/></g>`;

function drill(){
  /* coleta corta: 6 rulos (el último más pequeño), subida ~14px */

const SCENE_SPRITE = {};
const teto = (()=>{ const d=document.createElement('div'); d.innerHTML=tetoSVG(); return d.firstElementChild; })();
const setCls = c => teto.setAttribute('class', c);
const REACT = { neutral:"r-soft", smile:"r-soft", happy:"r-hop", wink:"r-tilt", shy:"r-shy", surprised:"r-pop" };
function placeTeto(id){
  document.querySelectorAll('.tetoslot').forEach(s=>s.innerHTML='');
  document.querySelector('#'+id+' .tetoslot').appendChild(teto);
  setCls('teto pop');
}
function setExprOne(name){
  const e = E_[name] || E_.neutral, q = i => teto.querySelector('#'+i);
  q('eyes').innerHTML = e.eyes(); q('brows').setAttribute('d', e.brows); q('mouth').innerHTML = e.mouth; q('blush').style.opacity = e.blush;
  setCls('teto'); void teto.getBoundingClientRect();
  setCls('teto ' + (REACT[name] || 'r-soft'));
  if (typeof burst === 'function') burst();
}

/* ============ PARTÍCULAS ============ */
const fx = document.getElementById('fx');
function spawn(){
  if(document.hidden) return;
  const el = document.createElement('span');
  el.className = 'fl';
  if (Math.random() < .5){ el.classList.add('st'); el.style.setProperty('--s', (8+Math.random()*16)+'px'); }
  else el.textContent = CONFIG.particles[Math.random()*CONFIG.particles.length|0];
  el.style.left = Math.random()*100+'%';
  el.style.fontSize = (14+Math.random()*26)+'px';
  el.style.animationDuration = (6+Math.random()*6)+'s';
  el.style.color = Math.random()>.5 ? 'var(--red)' : '#fff';
  fx.appendChild(el);
  setTimeout(()=>el.remove(),12500);
}
setInterval(spawn, CONFIG.particleEveryMs);
for(let i=0;i<6;i++) setTimeout(spawn,i*150);

function burst(){
  const r = teto.getBoundingClientRect(); if(!r.width) return;
  const cx = r.left + r.width/2, cy = r.top + r.height*.3, app = document.getElementById('app');
  for(let i=0;i<14;i++){
    const b = document.createElement('span'), a = Math.random()*6.28, d = 70+Math.random()*90;
    b.className = 'bst' + (i%3===0 ? ' h' : ''); if(i%3===0) b.textContent = '♥';
    b.style.cssText = `left:${cx}px;top:${cy}px;--s:${8+Math.random()*12}px;--dx:${Math.cos(a)*d}px;--dy:${Math.sin(a)*d-20}px`;
    app.appendChild(b); setTimeout(()=>b.remove(), 950);
  }
}
function flashGlitch(){ const g = document.getElementById('gl'); g.classList.remove('go'); void g.offsetWidth; g.classList.add('go'); }

/* ============ ESCENAS ============ */
const $ = s => document.querySelector(s);
function show(id){
  flashGlitch();
  document.querySelectorAll('.scene').forEach(s=>s.classList.toggle('on', s.id===id));
  placeTeto(id);
}

/* Escena 1 */
placeTeto('s1'); setExprOne('happy');
$('#gift').addEventListener('click', () => {
  SND.start(); startMusic(); startDialogs();
});

/* Escena 2 */
let idx = 0, timer = null, typing = false;
const txt = $('#txt'), box = $('#box');
const dots = $('#dots');
DIALOGS.forEach(()=>dots.appendChild(document.createElement('i')));

function startDialogs(){ show('s2'); idx = 0; setTimeout(()=>showDialog(0), 600); }
function showDialog(i){
  idx = i;
  const d = DIALOGS[i];
  clearInterval(timer);
  [...dots.children].forEach((x,k)=>x.classList.toggle('on',k===i));
  $('#prev').disabled = i===0;
  box.classList.remove('in'); void box.offsetWidth; box.classList.add('in');
  setExprOne(d.expr);
  txt.textContent = ''; txt.classList.remove('done'); typing = true;
  let n = 0;
  timer = setInterval(()=>{
    txt.textContent = d.text.slice(0, ++n); SND.blip(d.text[n-1]);
    if(n >= d.text.length){ clearInterval(timer); typing = false; txt.classList.add('done'); }
  }, CONFIG.typeSpeedMs);
}
function finishTyping(){
  clearInterval(timer); typing = false;
  txt.textContent = DIALOGS[idx].text; txt.classList.add('done');
}
$('#next').addEventListener('click', ()=>{
  if(typing){ SND.tap(); finishTyping(); return; }
  if(idx < DIALOGS.length-1){ SND.next(); showDialog(idx+1); } else { SND.whoosh(); toGift(); }
});
$('#prev').addEventListener('click', ()=>{ if(idx>0){ SND.prev(); showDialog(idx-1); } });
box.addEventListener('click', ()=>{ if(typing){ SND.tap(); finishTyping(); } });

/* Teclado (PC) */
document.addEventListener('keydown', e=>{
  if(!$('#s2').classList.contains('on')) return;
  if(e.key==='ArrowRight' || e.key==='Enter' || e.key===' '){ e.preventDefault(); $('#next').click(); }
  else if(e.key==='ArrowLeft'){ $('#prev').click(); }
});
document.addEventListener('click', e=>{ const b = e.target.closest && e.target.closest('.btn'); if(b) b.blur(); });

/* Escena 3 */
$('#play').addEventListener('click', ()=>{ SND.play(); if (SPOTIFY_URL) window.open(SPOTIFY_URL, '_blank', 'noopener'); });
function toGift(){
  const w = $('#wipe');
  w.classList.remove('go'); void w.offsetWidth; w.classList.add('go');
  setTimeout(()=>{
    show('s3'); setExprOne('smile');
    for(let i=0;i<14;i++){
      const s = document.createElement('span');
      s.className='spk'; s.textContent = i%2?'✦':'✧';
      s.style.cssText = `left:${Math.random()*92}%;top:${Math.random()*40}%;font-size:${14+Math.random()*20}px;animation-delay:${Math.random()*2}s`;
      $('#s3').appendChild(s);
    }
  }, 600);
}

/* Pantalla de carga */
document.getElementById('ldsvg').innerHTML = '<defs><linearGradient id="hg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ff7d9b"/><stop offset="1" stop-color="#d6244a"/></linearGradient></defs><path d="M50 84C20 62 4 46 4 28 4 14 15 6 27 6c9 0 18 5 23 13C55 11 64 6 73 6c12 0 23 8 23 22 0 18-16 34-46 56z" fill="url(#hg)" stroke="#fff" stroke-width="4" stroke-linejoin="round"/><path d="M18 26c0-6 4-10 10-10" fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round" opacity=".7"/>';
const t0 = performance.now();
function endLoad(){
  setTimeout(()=>{
    const L = document.getElementById('load');
    const go = ()=>{
      L.classList.add('hide');
      setTimeout(()=>{ L.remove(); placeTeto('s1'); setExprOne('happy'); }, 600);
    };
    /* Intenta arrancar la música apenas termina la carga */
    try{ startMusic(); ac.resume().catch(()=>{}); }catch(e){}
    setTimeout(()=>{
      if (ac && ac.state === 'running'){ go(); return; }
      /* El navegador bloquea el audio sin un toque: se pide uno aquí, en la carga,
         para que la música ya esté sonando cuando aparece Teto */
      L.classList.add('wait');
      const tap = ()=>{
        ['pointerdown','keydown'].forEach(e=>L.removeEventListener(e, tap));
        unlockAudio(); go();
      };
      ['pointerdown','keydown'].forEach(e=>L.addEventListener(e, tap));
      addEventListener('keydown', tap, {once:true});
    }, 250);
  }, Math.max(0, 1900-(performance.now()-t0)));
}
if (document.readyState === 'complete') endLoad(); else addEventListener('load', endLoad);

/* Glitch ocasional */
setInterval(()=>{ setCls('teto'); void teto.getBoundingClientRect(); setCls('teto glitch'); }, 7000);

/* Al volver desde Spotify la página sigue en su estado actual */
